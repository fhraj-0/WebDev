<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Promo Code Revealer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="greet">
        <h1>Hello</h1>
      </div>
      <div class="code-card">
        <h2>Claim your code</h2>
        <p class="code-display"></p>
        <div class="btn">
          <button id="reveal-btn">Claim</button>
          <button id="copy-btn">Copy</button>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
